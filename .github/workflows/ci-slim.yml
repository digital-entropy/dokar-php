name: Docker build for slim variant
on: 
  push:
    branches:
      - 8.4
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-cli:
    runs-on: ubuntu-26.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USR }}
          password: ${{ secrets.GHCR_PAT }}
      -
        name: Build amd64 for testing
        uses: docker/build-push-action@v7
        with:
          context: slim/cli/
          platforms: linux/amd64
          load: true
          tags: dokar-slim-test:cli
      -
        name: Smoke test
        run: sh .github/scripts/slim-smoke.sh cli dokar-slim-test:cli 8.4 8.4.28
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: slim/cli/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/digital-entropy/dokar-php/cli:8.4-slim

  build-fpm:
    needs: build-cli
    runs-on: ubuntu-26.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USR }}
          password: ${{ secrets.GHCR_PAT }}
      -
        name: Build amd64 for testing
        uses: docker/build-push-action@v7
        with:
          context: slim/fpm/
          platforms: linux/amd64
          load: true
          tags: dokar-slim-test:fpm
      -
        name: Smoke test
        run: sh .github/scripts/slim-smoke.sh fpm dokar-slim-test:fpm 8.4 8.4.28
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: slim/fpm/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/digital-entropy/dokar-php/fpm:8.4-slim

  build-octane:
    runs-on: ubuntu-26.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USR }}
          password: ${{ secrets.GHCR_PAT }}
      -
        name: Build amd64 for testing
        uses: docker/build-push-action@v7
        with:
          context: slim/octane/
          platforms: linux/amd64
          load: true
          tags: dokar-slim-test:octane
      -
        name: Smoke test
        run: sh .github/scripts/slim-smoke.sh octane dokar-slim-test:octane 8.4 8.4.28
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: slim/octane/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/digital-entropy/dokar-php/octane:8.4-slim

  build-nginx:
    needs: build-fpm
    runs-on: ubuntu-26.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USR }}
          password: ${{ secrets.GHCR_PAT }}
      -
        name: Build amd64 for testing
        uses: docker/build-push-action@v7
        with:
          context: slim/nginx/
          platforms: linux/amd64
          load: true
          tags: dokar-slim-test:nginx
      -
        name: Smoke test
        run: sh .github/scripts/slim-smoke.sh nginx dokar-slim-test:nginx 8.4 8.4.28
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: slim/nginx/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/digital-entropy/dokar-php/nginx:8.4-slim
