name: Legacy PHP candidate verification
on:
  push:
    branches: ["7.4"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: legacy-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USR }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: cli/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/digital-entropy/dokar-php/cli:7.4-candidate-${{ github.sha }}
      - name: Verify published candidate on both architectures
        env:
          IMAGE: ghcr.io/digital-entropy/dokar-php/cli@${{ steps.build.outputs.digest }}
        run: bash .github/scripts/verify-image.sh "$IMAGE" "7.4" "1:7.4.33-31" "cli"
  build-fpm:
    needs: build-cli
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USR }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: fpm/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/digital-entropy/dokar-php/fpm:7.4-candidate-${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/digital-entropy/dokar-php/cli@${{ needs.build-cli.outputs.digest }}
      - name: Verify published candidate on both architectures
        env:
          IMAGE: ghcr.io/digital-entropy/dokar-php/fpm@${{ steps.build.outputs.digest }}
        run: bash .github/scripts/verify-image.sh "$IMAGE" "7.4" "1:7.4.33-31" "fpm"
  build-nginx:
    needs: build-fpm
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USR }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: nginx/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/digital-entropy/dokar-php/nginx:7.4-candidate-${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/digital-entropy/dokar-php/fpm@${{ needs.build-fpm.outputs.digest }}
      - name: Verify published candidate on both architectures
        env:
          IMAGE: ghcr.io/digital-entropy/dokar-php/nginx@${{ steps.build.outputs.digest }}
        run: bash .github/scripts/verify-image.sh "$IMAGE" "7.4" "1:7.4.33-31" "nginx"
  promote:
    needs: [build-cli, build-fpm, build-nginx]
    if: github.ref == 'refs/heads/7.4'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USR }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Promote verified candidates to release tags
        env:
          REPO: ghcr.io/digital-entropy/dokar-php
          CLI_DIGEST: ${{ needs.build-cli.outputs.digest }}
          FPM_DIGEST: ${{ needs.build-fpm.outputs.digest }}
          NGINX_DIGEST: ${{ needs.build-nginx.outputs.digest }}
        run: |
          set -euo pipefail
          for entry in cli=$CLI_DIGEST fpm=$FPM_DIGEST nginx=$NGINX_DIGEST; do
            name=${entry%%=*} digest=${entry#*=}
            docker buildx imagetools create --tag "$REPO/$name:7.4" "$REPO/$name@$digest"
            want=$(docker buildx imagetools inspect "$REPO/$name@$digest" --raw | jq -c '[.manifests[] | select(.platform.os == "linux") | .digest] | sort')
            got=$(docker buildx imagetools inspect "$REPO/$name:7.4" --raw | jq -c '[.manifests[] | select(.platform.os == "linux") | .digest] | sort')
            [ "$want" = "$got" ] || { echo "$name:7.4 does not match candidate $digest" >&2; exit 1; }
            echo "$name:7.4 -> $digest $got"
          done
